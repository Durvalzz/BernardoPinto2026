        <main>
            <section class="card">
            <h2>Entre em Contato / Avaliação</h2>
            
            <form action="#" method="POST">
                <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required pattern="[A-Za-zÀ-ÿ\s]+" title="Apenas letras e espaços são permitidos" required placeholder="Digite seu nome completo">
                </div>

                <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div>
                <label for="avaliacao">Sua Avaliação (0 a 5):</label>
                <select id="avaliacao" name="avaliacao" required>
                    <option value="" disabled selected>Selecione uma nota</option>
                    <option value="0">0 - Muito Ruim</option>
                    <option value="1">1 - Ruim</option>
                    <option value="2">2 - Regular</option>
                    <option value="3">3 - Bom</option>
                    <option value="4">4 - Muito Bom</option>
                    <option value="5">5 - Excelente</option>
                </select>
                </div>

                <div>
                <label for="comentario">Deixe aqui seu comentário:</label>
                <textarea id="comentario" name="comentario" rows="5" placeholder="Deixe aqui seu comentário." required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>
            </section>
        </main>
